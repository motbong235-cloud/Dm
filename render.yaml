services:
  - type: web
    name: kairozen-admin-manager
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python admin_manager_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: admin-data
      mountPath: /var/data
      sizeGB: 1
